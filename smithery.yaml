startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      licenseKey:
        type: string
        description: "Optional Pro License Key (from polar.sh/saidkomi) to remove watermark and unlock pro features"
  commandFunction: |-
    (config) => ({
      command: 'npx',
      args: ['-y', 'mcp-carousel-engine'],
      env: config.licenseKey ? { CAROUSEL_LICENSE_KEY: config.licenseKey } : {}
    })
